# SERVER
server.port=${PORT:8080}

# DATA SOURCE
spring.datasource.url=jdbc:h2:file:~/stocky
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=0210pas5

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# DEVTOOLS
spring.devtools.restart.enabled=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.issuer=${JWT_ISSUER}

# APP USER
stocky.system.password=${STOCKY_SYSTEM_PASSWORD}
stocky.system.username=${STOCKY_SYSTEM_USERNAME}

# CORS
# Comma-separated list of origins allowed to call the API. The frontend is
# served from the same origin as the API in production, but Spring's CORS
# check still rejects the request with a 403 (before it reaches any
# controller) unless that origin is explicitly listed here.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://stocks-production-55e8.up.railway.app}