#----------------------------
# SERVER CONFIGURATIONS
#----------------------------
server.port=${PORT}
server.error.include-message=always
server.error.include-exception=true
server.error.include-binding-errors=always
server.error.include-stacktrace=true

#----------------------------
# SPRING CONFIGURATIONS
#----------------------------
spring.main.banner-mode=log

#----------------------------
# DATA SOURCE - H2
#----------------------------
spring.datasource.url=jdbc:h2:file:~/stocky
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=0210pas5

#----------------------------
# H2
#----------------------------
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

#----------------------------
# JPA
#----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.generate-ddl=true

#----------------------------
# DEVTOOLS
#----------------------------
spring.devtools.restart.enabled=false

#----------------------------
# JWT
#----------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.issuer=${JWT_ISSUER}

#----------------------------
# APP USER
#----------------------------
stocky.system.password=${STOCKY_SYSTEM_PASSWORD}
stocky.system.username=${STOCKY_SYSTEM_USERNAME}